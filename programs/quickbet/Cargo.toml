[package]
name = "quickbet"
version = "0.1.0"
description = "QuickBet: table escrow with majority-vote payout (devnet demo)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "quickbet"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "1.1.2"
anchor-spl = "1.1.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
